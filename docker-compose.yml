version: "3.9"

services:
  # ── PostgreSQL 16 + pgvector ──────────────────────────────────────────────
  db:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-northwind}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-northwind}
      POSTGRES_DB: ${POSTGRES_DB:-northwind}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/01_init.sql:ro
    ports:
      - "5433:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-northwind} -d ${POSTGRES_DB:-northwind}" ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  # ── FastAPI backend ────────────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-northwind}:${POSTGRES_PASSWORD:-northwind}@db:5432/${POSTGRES_DB:-northwind}
      JWT_SECRET: ${JWT_SECRET}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY}
      LLM_MODEL: ${LLM_MODEL:-gemini-flash-latest}
      CONFIDENCE_THRESHOLD: ${CONFIDENCE_THRESHOLD:-0.68}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173}
    ports:
      - "8001:8000"
    # Run migrations then start the server
    command: >
      sh -c "alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    volumes:
      - ./backend:/app # mount source for --reload during development
      - ./scripts:/app/scripts
      - ./corpus:/app/corpus
      - ./metrics:/app/metrics
volumes:
  pgdata:
